[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "weston-webdriver"
version = "0.1.0"
description = "W3C WebDriver server for driving Weston desktops in automated UI tests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.8",
    "pywayland>=0.4.17",
    "xkbcommon>=1.0",
    "Pillow>=9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "requests>=2.28",
    "selenium>=4.10",
]

[project.scripts]
weston-webdriver = "weston_webdriver.__main__:main"

[tool.setuptools.packages.find]
include = ["weston_webdriver*"]

[tool.setuptools.package-data]
"weston_webdriver.protocols" = ["xml/*.xml"]
